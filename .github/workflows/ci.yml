name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # "Run workflow" button on GitHub: rebuild everything (incl. the APK) on demand.
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: cargo install cargo-ndk --locked
      - name: Release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.COMMX_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/commx.jks"
            echo "COMMX_KEYSTORE=$RUNNER_TEMP/commx.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          COMMX_KEYSTORE_PASSWORD: ${{ secrets.COMMX_KEYSTORE_PASSWORD }}
          COMMX_KEY_ALIAS: ${{ secrets.COMMX_KEY_ALIAS }}
          COMMX_KEY_PASSWORD: ${{ secrets.COMMX_KEY_PASSWORD }}
        run: cd android && ./gradlew --no-daemon assembleRelease && cp app/build/outputs/apk/release/app-release.apk ../commx-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: commx-android
          path: commx-android.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: commx-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64, ext: "" }
          - { os: macos-latest, name: macos-arm64, ext: "" }
          - { os: windows-latest, name: windows-x86_64, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo build --release --workspace
      - shell: bash
        run: |
          mkdir -p out/commx-${{ matrix.name }}
          cp target/release/commxd${{ matrix.ext }} target/release/commx${{ matrix.ext }} out/commx-${{ matrix.name }}/
          cp README.md out/commx-${{ matrix.name }}/
          if [ "${{ matrix.ext }}" = ".exe" ]; then cp dist/install-windows.ps1 out/commx-${{ matrix.name }}/; else cp dist/*.plist dist/*.service out/commx-${{ matrix.name }}/; fi
          cd out && 7z a ../commx-${{ matrix.name }}.zip commx-${{ matrix.name }} >/dev/null 2>&1 || zip -r ../commx-${{ matrix.name }}.zip commx-${{ matrix.name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: commx-${{ matrix.name }}.zip
