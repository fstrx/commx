name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64, ext: "" }
          - { os: macos-latest, name: macos-arm64, ext: "" }
          - { os: windows-latest, name: windows-x86_64, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --workspace
      - shell: bash
        run: |
          mkdir -p out/commx-${{ matrix.name }}
          cp target/release/commxd${{ matrix.ext }} target/release/commx${{ matrix.ext }} out/commx-${{ matrix.name }}/
          cp README.md out/commx-${{ matrix.name }}/
          if [ "${{ matrix.ext }}" = ".exe" ]; then cp dist/install-windows.ps1 out/commx-${{ matrix.name }}/; else cp dist/*.plist dist/*.service out/commx-${{ matrix.name }}/; fi
          cd out && 7z a ../commx-${{ matrix.name }}.zip commx-${{ matrix.name }} >/dev/null 2>&1 || zip -r ../commx-${{ matrix.name }}.zip commx-${{ matrix.name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: commx-${{ matrix.name }}.zip
