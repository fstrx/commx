[package]
name = "commxd"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
commx-core = { workspace = true, features = ["native"] }
anyhow.workspace = true
serde_json.workspace = true
rand.workspace = true
snow.workspace = true
tokio.workspace = true
clap.workspace = true
libc.workspace = true
hex.workspace = true
postcard.workspace = true
serde.workspace = true
blake3.workspace = true
sha1 = "0.10"
data-encoding.workspace = true
zeroize.workspace = true
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"], optional = true }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"], optional = true }
sha2 = { version = "0.11.0", optional = true }

[features]
default = ["web-tls"]
# HTTPS for the browser client (`--web-tls`). The Android app never serves
# the browser client, so it builds without this.
web-tls = ["dep:tokio-rustls", "dep:rustls", "dep:rcgen", "dep:sha2"]

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
commx-core.workspace = true
hex.workspace = true
serde_json.workspace = true
libc.workspace = true
